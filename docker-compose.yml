x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: fixmyblock
  WORDPRESS_DB_PASSWORD: password
  WORDPRESS_DB_NAME: fixmyblock
  WORDPRESS_DEBUG: 1
  # Log errors to `docker compose logs` rather than the page, since the
  # bundled Carbon Fields triggers PHP 8.5 deprecation notices that would
  # otherwise be output before WordPress sends its headers.
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'WP_DEBUG_LOG', '/dev/stderr' );

services:

  wordpress:
    image: wordpress:php8.5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *wordpress-env
    ports:
      - "8000:80"
    volumes:
      - wordpress:/var/www/html
      - ./fixmyblock-theme:/var/www/html/wp-content/themes/fixmyblock-theme
      - ./conf/mailpit.php:/var/www/html/wp-content/mu-plugins/mailpit.php:ro
      - ./conf/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  # Installs WordPress and activates the theme, then exits.
  # Also handy for running other wp-cli commands, eg:
  # docker compose run --rm wpcli wp plugin list
  wpcli:
    image: wordpress:cli-php8.5
    user: "33:33" # www-data in the wordpress image
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      <<: *wordpress-env
      HOME: /tmp # so wp-cli can write its cache
    volumes:
      - wordpress:/var/www/html
      - ./fixmyblock-theme:/var/www/html/wp-content/themes/fixmyblock-theme
      - ./conf/mailpit.php:/var/www/html/wp-content/mu-plugins/mailpit.php:ro
      - ./conf/wp-setup.sh:/usr/local/bin/wp-setup:ro
      - ./bin:/fixmyblock/bin:ro
    command: wp-setup

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: fixmyblock
      MARIADB_USER: fixmyblock
      MARIADB_PASSWORD: password
      MARIADB_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 30
    volumes:
      - db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: password
    ports:
      - "3000:80"

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  wordpress:
  db:
